# Broad-coverage sources for Ayush's Europe-focused search.
#
# Adzuna supports country-specific endpoints. The custom `country` field is
# consumed by app/aggregator_clients.py and is NOT sent as an API parameter.
# Keep queries intentionally broad; deterministic filters + OpenAI scoring
# provide the precision later.

aggregators:
  - name: Arbeitnow (Europe/Germany ATS feed)
    type: arbeitnow
    params:
      max_pages: 8
    notes: >
      Free, no key required. Europe-focused feed sourced largely from ATSs
      including Greenhouse, SmartRecruiters, JOIN, Teamtailor and Recruitee.

  - name: Adzuna Germany - software/backend
    type: adzuna
    params:
      country: "de"
      what: "software engineer OR backend developer OR typescript OR node.js"
      results_per_page: 50
      max_pages: 5

  - name: Adzuna France - software/backend
    type: adzuna
    params:
      country: "fr"
      what: "software engineer OR backend developer OR typescript OR node.js"
      results_per_page: 50
      max_pages: 4

  - name: Adzuna Netherlands - software/backend
    type: adzuna
    params:
      country: "nl"
      what: "software engineer OR backend developer OR typescript OR node.js"
      results_per_page: 50
      max_pages: 4

  - name: Adzuna Poland - software/backend
    type: adzuna
    params:
      country: "pl"
      what: "software engineer OR backend developer OR typescript OR node.js"
      results_per_page: 50
      max_pages: 4

  - name: Adzuna Italy - software/backend
    type: adzuna
    params:
      country: "it"
      what: "software engineer OR backend developer OR typescript OR node.js"
      results_per_page: 50
      max_pages: 4

  - name: Remotive (remote software development)
    type: remotive
    params:
      category: "software-dev"
    notes: >
      Remote-only supplement. Location filters still reject postings that are
      clearly restricted outside Europe/EMEA.
