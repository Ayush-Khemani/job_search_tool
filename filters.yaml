# Ayush-specific deterministic pre-filter rules.
# These filters are intentionally conservative: cheap hard rejections happen
# before any OpenAI call, while ambiguous cases are left for AI evaluation.

priority_title_keywords:
  - "junior software engineer"
  - "junior software developer"
  - "graduate software engineer"
  - "graduate developer"
  - "backend engineer"
  - "backend developer"
  - "back-end engineer"
  - "full stack engineer"
  - "full-stack engineer"
  - "fullstack engineer"
  - "software engineer"
  - "software developer"

title_allow_keywords:
  - "software engineer"
  - "software developer"
  - "backend"
  - "back-end"
  - "back end"
  - "full stack"
  - "full-stack"
  - "fullstack"
  - "node"
  - "typescript"
  - "javascript"
  - "web developer"
  - "application developer"
  - "platform engineer"
  - "ai engineer"
  - "machine learning engineer"
  - "ml engineer"
  - "developer"

exclusion_keywords:
  - "sales engineer"
  - "solutions engineer"
  - "solution engineer"
  - "support engineer"
  - "customer success"
  - "field engineer"
  - "mechanical engineer"
  - "electrical engineer"
  - "civil engineer"
  - "chemical engineer"
  - "hardware engineer"
  - "qa engineer"
  - "quality assurance"
  - "test engineer"
  - "security engineer"
  - "embedded"
  - "firmware"
  - "wordpress"
  - "sap consultant"

# Hard title-level seniority exclusions. These are checked BEFORE the
# priority-title shortcut so "Senior Software Engineer" cannot slip through.
seniority_exclusion_keywords:
  - "senior"
  - "sr."
  - "sr "
  - "staff"
  - "principal"
  - "lead engineer"
  - "tech lead"
  - "technical lead"
  - "engineering manager"
  - "manager, engineering"
  - "head of"
  - "director"
  - "architect"
  - "distinguished"

# Positive signals used by the AI prompt/UI. A title does not have to contain
# one of these because many European companies simply use "Software Engineer"
# for an early-career opening.
seniority_preferred_keywords:
  - "junior"
  - "graduate"
  - "new grad"
  - "entry level"
  - "entry-level"
  - "early career"
  - "associate"
  - "software engineer i"
  - "developer i"
  - "trainee"

# If a JD explicitly states 4+ years (or "at least 4 years") of professional
# experience, reject it before AI scoring. 2-3 year requirements are left to
# the model because companies often treat them flexibly for strong graduates.
max_required_years: 3

# Europe-aware allowlist. We accept country names, major target cities, EMEA,
# EU/Europe-wide remote wording, and Hungary/Budapest as the home market.
# Bare "Remote" is deliberately NOT enough because it may mean US-only.
location_allow_patterns:
  - '\beurope\b'
  - '\beuropean union\b'
  - '\beu\b'
  - '\bemea\b'
