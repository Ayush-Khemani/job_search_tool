# Technologies that are usually a mismatch when they are the ONLY backend
# stack mentioned. Mixed-stack roles still pass if they mention stack_core.
stack_dealbreakers:
  - '\bcobol\b'
  - '\bsap abap\b'
  - '\bmainframe\b'
  - '\bdelphi\b'
  - '\bobjective-c\b'

# Ayush's strongest/current search stack. Python remains acceptable but is
# intentionally not enough by itself to trigger a "core-stack rescue".
stack_core:
  - '\btypescript\b'
  - '\bjavascript\b'
  - '\bnode(?:\.?js)?\b'
  - '\bnest(?:\.?js)?\b'
  - '\bexpress(?:\.?js)?\b'
  - '\breact\b'
  - '\bpostgres(?:ql)?\b'
  - '\bsupabase\b'
  - '\bgraphql\b'
  - '\bredis\b'
  - '\brabbitmq\b'
  - '\bpub\/?sub\b'
  - '\bdocker\b'
  - '\bkubernetes\b'

truncated_description_min_chars: 400
